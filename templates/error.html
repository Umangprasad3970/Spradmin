<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Error</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f6f9;
      text-align: center;
    }
    .box {
      background: white;
      padding: 40px 60px;
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      max-width: 90%;
      width: 400px;
    }

    @media (max-width: 480px) {
      .box {
        padding: 30px 20px;
        width: 90%;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 16px;
      }
    }

    h1 { color: #dc2626; }
    p { color: #374151; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Error</h1>
    <p>{{ error_message }}</p>
    <a href="/" style="color:#2563eb;">Go Back Home</a>
  </div>
</body>
</html>
